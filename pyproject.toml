[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-copilot"
version = "0.1.0"
description = "ServiceNow Incident Copilot using typed tools, LangGraph, approval gates and evaluation"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.50",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "anthropic>=0.40.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
